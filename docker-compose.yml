services:

  web:
    build: .
    container_name: pesquisa_enps_web

    command: gunicorn enps.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120

    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media

    expose:
      - "8000"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy
    restart: always


  db:
    image: postgres:16
    container_name: pesquisa_enps_db
    volumes: 
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always
    
  nginx:
    image: nginx:stable
    container_name: pesquisa_enps_nginx
    ports:
      - "5012:80"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: always


volumes:
  postgres_data:
  static_volume:
  media_volume: